<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CityPulse - Türkiye'nin Gerçek Mekan Rehberi</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/styles/index.css?v=2">
  
  <!-- React 18 UMD -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Services & Turkey 81 Provinces Data -->
  <script src="./src/services/turkeyCities.js?v=3"></script>
  <script src="./src/services/placesService.js?v=3"></script>

  <!-- Pre-compiled Application Bundle (Classic UMD, Zero Imports) -->
  <script src="./src/app.bundle.js?v=3"></script>
  
  <!-- Mount Application -->
  <script>
    (function () {
      function mountApp() {
        if (window.ReactDOM && window.App) {
          const container = document.getElementById('root');
          if (container) {
            const root = ReactDOM.createRoot(container);
            root.render(React.createElement(window.App));
            console.log("CityPulse başarıyla başlatıldı.");
          }
        } else {
          console.error("CityPulse App veya React yüklenemedi:", { 
            React: !!window.React, 
            ReactDOM: !!window.ReactDOM, 
            App: !!window.App 
          });
        }
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", mountApp);
      } else {
        mountApp();
      }
    })();
  </script>
</body>
</html>
